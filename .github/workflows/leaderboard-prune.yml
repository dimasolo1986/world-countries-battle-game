name: Prune leaderboard

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Installed only for this job; the game itself has no firebase-admin dependency.
      - run: npm install firebase-admin --no-save
      - run: node scripts/prune-leaderboard.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
